# ===============================
# CONFIG / PERFIL
# ===============================

spring.config.import=optional:configserver:http://config-server:8888,optional:file:.env[properties]
spring.profiles.active=dev

spring.application.name=ventas


# ===============================
# SERVER
# ===============================

server.port=8084


# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:postgresql://postgres:5432/microservices_db?currentSchema=schema_ventas
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.properties.hibernate.default_schema=schema_ventas


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true


# ===============================
# EUREKA
# ===============================

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true


# ===============================
# JACKSON
# ===============================

spring.jackson.deserialization.accept-float-as-int=false


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ===============================
# LOGGING
# ===============================

logging.level.root=WARN
logging.level.cinerama=INFO
logging.level.org.springframework.web=INFO


# ===============================
# CONFIG LOCAL (PAGOS)
# ===============================

app.pagos.simulado=true