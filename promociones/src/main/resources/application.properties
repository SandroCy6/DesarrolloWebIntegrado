# Conexión al servidor y perfil
spring.config.import=optional:configserver:http://localhost:8888,optional:file:.env[properties]
spring.profiles.active=dev

spring.application.name=promociones

server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:5432/PromocionesDB
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect