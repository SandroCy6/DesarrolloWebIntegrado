spring.config.import=optional:configserver:http://localhost:8888,optional:file:.env[properties]
spring.profiles.active=dev

spring.application.name=cliente

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cinerama_cliente
spring.datasource.username=postgres
spring.datasource.password=admin
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#Puerto del microservicio
server.port=8082

#RENIEC API
reniec.api.url=https://api.json.pe/api/dni
reniec.api.token=API_TOKEN_RENIEC

# Actuator
management.endpoints.web.exposure.include=health,info

# Silencia el SQL de Hibernate
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Solo muestra tus logs y warnings de Spring
logging.level.root=WARN
logging.level.cinerama=INFO

# CONEXION A EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
