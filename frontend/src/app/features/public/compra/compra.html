<div class="container-fluid bg-dark text-white py-5" style="min-height: 100vh;">
  <div class="container">
    <h2 class="text-center mb-4" style="color: var(--cr-gold);">Checkout de Entradas</h2>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <form (ngSubmit)="procesarCompra()" class="card bg-dark border-secondary p-4">

          <h4 class="mb-3 border-bottom border-secondary pb-2">Datos del Cliente</h4>
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">DNI</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="ventaRequest.dni" name="dni" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Nombre Completo</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="ventaRequest.nombre" name="nombre" required>
            </div>
          </div>
          <div class="row mb-4">
            <div class="col-md-6">
              <label class="form-label">Correo Electrónico</label>
              <input type="email" class="form-control bg-dark text-white border-secondary" [(ngModel)]="ventaRequest.correo" name="correo" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Celular</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="ventaRequest.celular" name="celular" required>
            </div>
          </div>

          <h4 class="mb-3 border-bottom border-secondary pb-2">Datos de Pago (Tarjeta)</h4>
          <div class="mb-3">
            <label class="form-label">Titular de la Tarjeta</label>
            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Como aparece en la tarjeta" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Número de Tarjeta</label>
            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="0000 0000 0000 0000" maxlength="16" required>
          </div>
          <div class="row mb-4">
            <div class="col-md-6">
              <label class="form-label">Fecha de Vencimiento</label>
              <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="MM/AA" maxlength="5" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Código de Seguridad (CVV)</label>
              <input type="password" class="form-control bg-dark text-white border-secondary" placeholder="123" maxlength="4" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-3" style="font-size: 1.2rem;">
            Pagar S/ {{ calcularTotal() }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
