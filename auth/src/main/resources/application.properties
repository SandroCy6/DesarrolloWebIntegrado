# ===============================
# APP
# ===============================

spring.application.name=auth
server.port=8081

# Carga variables desde .env (local)
spring.config.import=optional:file:.env[.properties]


# ===============================
# DATABASE (usa variables de entorno)
# ===============================
spring.datasource.url=jdbc:postgresql://postgres:5432/microservices_db?currentSchema=schema_auth
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=schema_auth


# ===============================
# JPA
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# SECURITY / JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

logging.level.org.springframework.security=TRACE


# ===============================
# EUREKA
# ===============================

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info