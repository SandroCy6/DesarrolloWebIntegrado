# ===============================
# APP
# ===============================

spring.application.name=notificaciones
server.port=8086

# Config Server (por si acaso) + .env
spring.config.import=optional:configserver:http://config-server:8888,optional:file:.env[.properties]

# ===============================
# EUREKA
# ===============================

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true


# ===============================
# EMAIL (RESEND SMTP)
# ===============================

spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}

spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.resend.com


# ===============================
# TWILIO (WHATSAPP)
# ===============================

twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM}