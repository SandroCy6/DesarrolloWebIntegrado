# Config Server / env local
spring.config.import=optional:configserver:http://config-server:8888,optional:file:.env[properties]

# ===============================
# Configuración del servidor
# ===============================

server.port=8082

spring.application.name=catalogo


# ===============================
# Conexión a PostgreSQL
# ===============================

spring.datasource.url=jdbc:postgresql://postgres:5432/microservices_db?currentSchema=schema_catalogo
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.properties.hibernate.default_schema=schema_catalogo


# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


