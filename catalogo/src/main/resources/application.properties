# Conexi�n al servidor y perfil
spring.config.import=optional:configserver:http://localhost:8888,optional:file:.env[properties]
spring.profiles.active=dev

# Nombre fundamental para que busque 'catalogo-dev.properties'
spring.application.name=catalogo

server.port=8082

# Conexi�n a Base de Datos
spring.datasource.url=jdbc:postgresql://localhost:5432/catalogo_db
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Token de TMDB
tmdb.api.token=


# CONEXION A EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true


# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.root=WARN
logging.level.cinerama=INFO
logging.level.org.springframework.web=INFO

