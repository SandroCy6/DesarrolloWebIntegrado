spring.application.name=api-gateway
server.port=8080
spring.config.import=optional:file:.env[.properties]

jwt.secret=${JWT_SECRET}

# EUREKA — cliente (para resolver lb://)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# ── RUTAS ─────────────────────────────────────────────────────────

# [0] AUTH — público
spring.cloud.gateway.server.webflux.routes[0].id=auth-login
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# [1] AUTH — /usuarios (ADMIN)
spring.cloud.gateway.server.webflux.routes[1].id=auth-usuarios
spring.cloud.gateway.server.webflux.routes[1].uri=lb://auth
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/usuarios/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthFilter=ROLE_ADMIN

# [2] CLIENTE — protegido
spring.cloud.gateway.server.webflux.routes[2].id=cliente-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://cliente
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/clientes/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=JwtAuthFilter=ROLE_ADMIN,ROLE_VERIFICADOR,ROLE_CAJERO,ROLE_GERENTE

# [3] CATALOGO — GETs públicos
spring.cloud.gateway.server.webflux.routes[3].id=catalogo-get-publico
spring.cloud.gateway.server.webflux.routes[3].uri=lb://catalogo
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cines/**,/api/salas/**,/api/peliculas/**,/api/horarios/**
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Method=GET

# [4] CATALOGO — escritura protegida
spring.cloud.gateway.server.webflux.routes[4].id=catalogo-write
spring.cloud.gateway.server.webflux.routes[4].uri=lb://catalogo
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/cines/**,/api/salas/**,/api/peliculas/**,/api/horarios/**
spring.cloud.gateway.server.webflux.routes[4].predicates[1]=Method=POST,PUT,DELETE
spring.cloud.gateway.server.webflux.routes[4].filters[0]=JwtAuthFilter=ROLE_ADMIN,ROLE_OPERADOR

# [5] PROMOCIONES — GETs públicos
spring.cloud.gateway.server.webflux.routes[5].id=promociones-get-publico
spring.cloud.gateway.server.webflux.routes[5].uri=lb://promociones
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/promociones/**,/api/productos/**,/api/promocion-productos/**,/api/reglas/**
spring.cloud.gateway.server.webflux.routes[5].predicates[1]=Method=GET

# [6] PROMOCIONES — escritura protegida
spring.cloud.gateway.server.webflux.routes[6].id=promociones-write
spring.cloud.gateway.server.webflux.routes[6].uri=lb://promociones
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/promociones/**,/api/productos/**,/api/promocion-productos/**,/api/reglas/**
spring.cloud.gateway.server.webflux.routes[6].predicates[1]=Method=POST,PUT,DELETE
spring.cloud.gateway.server.webflux.routes[6].filters[0]=JwtAuthFilter=ROLE_ADMIN,ROLE_GERENTE

# [7] VENTAS — protegido
spring.cloud.gateway.server.webflux.routes[7].id=ventas-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://ventas
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/ventas/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=JwtAuthFilter=ROLE_ADMIN,ROLE_CAJERO,ROLE_GERENTE