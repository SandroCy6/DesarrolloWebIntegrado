#   /api/cines/**
#   /catalogo/peliculas/**
#   /catalogo/salas/**
#   /catalogo/horarios/**

# [3] GET /api/cines/** — lectura para todos los roles
spring.cloud.gateway.server.webflux.routes[3].id=catalogo-cines-get
spring.cloud.gateway.server.webflux.routes[3].uri=lb://catalogo
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cines/**
spring.cloud.gateway.server.webflux.routes[3].predicates[1]=Method=GET,OPTIONS
spring.cloud.gateway.server.webflux.routes[3].filters[0]=JwtAuthFilter=ROLE_ADMIN,ROLE_OPERADOR,ROLE_GERENTE,ROLE_CAJERO,ROLE_VERIFICADOR

