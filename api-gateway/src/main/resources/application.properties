spring.application.name=api-gateway
server.port=8080
spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]

jwt.secret=${JWT_SECRET}

# EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# AUTH MS  (lb://auth  puerto 8081)

# [0] POST /auth/login — público, sin token
spring.cloud.gateway.server.webflux.routes[0].id=auth-login
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# [1] /usuarios/** — solo ROLE_ADMIN
spring.cloud.gateway.server.webflux.routes[1].id=auth-usuarios
spring.cloud.gateway.server.webflux.routes[1].uri=lb://auth
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/usuarios/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthFilter=ROLE_ADMIN

# CLIENTE MS  (lb://cliente  puerto 8081)
# Controller: /api/clientes

# [2] /api/clientes/** — ADMIN, VERIFICADOR, GERENTE
#     VERIFICADOR: POST /verificar  y  GET /{dni}
#     ADMIN y GERENTE: todo
spring.cloud.gateway.server.webflux.routes[2].id=cliente-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://cliente
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/clientes/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=JwtAuthFilter=ROLE_ADMIN,ROLE_VERIFICADOR,ROLE_GERENTE

# CATÁLOGO MS  (lb://catalogo  puerto 8082)
